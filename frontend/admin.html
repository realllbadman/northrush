<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>NorthRush Admin</title>
  <style>
    :root {
      --forest: #1f4d3a; --forest-dk: #163a2c; --pine: #2e6f52;
      --canvas: #f7f5f0; --card: #fff; --ink: #16241d; --muted: #6b7580;
      --amber: #e08a2b; --border: #e6e3db; --danger: #b3372f;
    }
    * { box-sizing: border-box; margin: 0; }
    [hidden] { display: none !important; }
    body { font-family: "Inter", system-ui, sans-serif; background: var(--canvas); color: var(--ink); line-height: 1.5; }
    header { background: var(--forest-dk); color: #fff; padding: 0.9rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
    header h1 { font-size: 1.05rem; letter-spacing: 0.05em; }
    header .tag { background: var(--amber); color: #fff; font-size: 0.7rem; font-weight: 700; padding: 0.15rem 0.6rem; border-radius: 999px; }
    header a { margin-left: auto; color: #cfe3d8; font-size: 0.85rem; text-decoration: none; white-space: nowrap; }
    header a:hover { color: #fff; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    .row { display: flex; gap: 0.8rem; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; }
    .tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .tab { border: 1px solid var(--border); background: var(--card); color: var(--ink); padding: 0.5rem 1.1rem; border-radius: 999px; font-weight: 600; cursor: pointer; font-size: 0.9rem; font-family: inherit; }
    .tab.active { background: var(--forest); color: #fff; border-color: var(--forest); }
    .count { background: rgba(31,77,58,.1); color: var(--forest); font-weight: 700; font-size: 0.75rem; padding: 0.1rem 0.55rem; border-radius: 999px; margin-left: 0.35rem; }
    .tab.active .count { background: rgba(255,255,255,.2); color: #fff; }
    .btn { border: 1px solid var(--border); background: var(--card); color: var(--ink); padding: 0.5rem 1rem; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 0.85rem; font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 0.35rem; }
    .btn:hover { border-color: var(--pine); }
    .btn--primary { background: var(--forest); border-color: var(--forest); color: #fff; }
    .btn--primary:hover { background: var(--pine); }
    .btn--primary:disabled { opacity: 0.55; cursor: progress; }
    .btn--danger { border-color: #e5b6b2; color: var(--danger); background: #fdf1f0; }
    .btn--danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
    .refresh { margin-left: auto; }
    .item { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.3rem; margin-bottom: 0.9rem; }
    .item__head { display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap; }
    .item__head h3 { font-size: 1rem; }
    .item__head .when { color: var(--muted); font-size: 0.78rem; }
    .item__head .total { margin-left: auto; font-weight: 800; color: var(--forest); font-size: 1.05rem; }
    .meta { display: flex; flex-wrap: wrap; gap: 0.35rem 1.1rem; margin: 0.5rem 0; font-size: 0.85rem; color: var(--muted); }
    .meta b { color: var(--ink); font-weight: 600; }
    .items-list { margin: 0.5rem 0; padding: 0.6rem 0.9rem; background: var(--canvas); border-radius: 10px; font-size: 0.85rem; }
    .items-list li { margin-left: 1rem; }
    .notes { font-size: 0.85rem; background: #fdf6ec; border: 1px solid #f0ddc0; border-radius: 10px; padding: 0.5rem 0.8rem; margin: 0.5rem 0; white-space: pre-wrap; }
    .del { border: 1px solid #e5b6b2; color: var(--danger); background: #fdf1f0; padding: 0.35rem 0.9rem; border-radius: 999px; cursor: pointer; font-size: 0.8rem; font-weight: 600; margin-top: 0.4rem; font-family: inherit; }
    .del:hover { background: var(--danger); color: #fff; }
    .empty, .error { text-align: center; color: var(--muted); padding: 3rem 1rem; }
    .error { color: var(--danger); }

    /* ---- Products list ---- */
    .toolbar { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
    .toolbar input, .toolbar select { font: inherit; font-size: 0.9rem; padding: 0.5rem 0.8rem; border: 1px solid var(--border); border-radius: 999px; background: var(--card); color: var(--ink); min-width: 0; }
    .toolbar input { flex: 1 1 220px; }
    .toolbar .btn--primary { margin-left: auto; }
    .plist { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.6rem; }
    .prow { display: flex; gap: 0.9rem; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0.6rem 0.9rem 0.6rem 0.6rem; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
    .prow:hover { border-color: var(--pine); }
    .prow img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: var(--canvas); flex: none; }
    .prow__main { flex: 1; min-width: 0; }
    .prow__name, .prow__sub { display: block; }
    .prow__name { font-weight: 700; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .prow__sub { color: var(--muted); font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .prow__price { font-weight: 800; color: var(--forest); white-space: nowrap; }
    .pill { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 0.05rem 0.5rem; border-radius: 999px; margin-right: 0.3rem; vertical-align: 1px; }
    .pill--out { background: #fdf1f0; color: var(--danger); }
    .pill--badge { background: #fdf0e1; color: #a35d12; }
    .pill--nophoto { background: #eef0f2; color: var(--muted); }
    .listnote { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.6rem; }

    /* ---- Editor dialog ---- */
    dialog { border: none; border-radius: 16px; padding: 0; width: min(760px, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); background: var(--canvas); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    dialog::backdrop { background: rgba(22,36,29,.55); }
    .ed { display: flex; flex-direction: column; max-height: calc(100vh - 2rem); }
    .ed__head { display: flex; align-items: center; gap: 0.6rem; padding: 1rem 1.3rem; background: var(--card); border-bottom: 1px solid var(--border); }
    .ed__head h2 { font-size: 1.05rem; flex: 1; }
    .ed__close { border: none; background: none; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--muted); padding: 0.2rem 0.4rem; }
    .ed__body { overflow-y: auto; min-height: 0; padding: 1.2rem 1.3rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.1rem; }
    .ed__foot { display: flex; gap: 0.6rem; align-items: center; padding: 0.9rem 1.3rem; background: var(--card); border-top: 1px solid var(--border); flex-wrap: wrap; }
    .ed__foot .spacer { flex: 1; }
    .ed__msg { color: var(--danger); font-size: 0.85rem; font-weight: 600; width: 100%; }
    .ed__msg:empty { display: none; }
    fieldset { border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 1rem; display: grid; gap: 0.9rem; min-width: 0; }
    legend { font-weight: 700; font-size: 0.85rem; padding: 0 0.4rem; color: var(--forest); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.9rem; }
    label.f { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 0.3rem; row-gap: 0.3rem; font-size: 0.82rem; font-weight: 600; }
    label.f small, .hint { font-weight: 400; color: var(--muted); font-size: 0.76rem; }
    .f input, .f select, .f textarea { flex: 1 1 100%; font: inherit; font-size: 0.95rem; padding: 0.55rem 0.7rem; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--ink); width: 100%; }
    .f textarea { resize: vertical; min-height: 5.5rem; }
    .f input:focus, .f select:focus, .f textarea:focus { outline: 2px solid var(--pine); outline-offset: -1px; }
    .check { display: flex; gap: 0.5rem; align-items: center; font-size: 0.9rem; font-weight: 600; }
    .check input { width: 1.1rem; height: 1.1rem; accent-color: var(--forest); }
    .req { color: var(--danger); }

    /* ---- Photos ---- */
    .drop { border: 2px dashed #c9c4b6; border-radius: 12px; padding: 1.2rem; text-align: center; cursor: pointer; color: var(--muted); font-size: 0.9rem; background: var(--canvas); }
    .drop strong { color: var(--forest); display: block; font-size: 1rem; margin-bottom: 0.15rem; }
    .drop.over { border-color: var(--forest); background: #eaf2ed; }
    .drop input { display: none; }
    .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.7rem; }
    .photos:empty { display: none; }
    .ph { position: relative; border-radius: 10px; overflow: hidden; background: var(--canvas); border: 2px solid var(--border); aspect-ratio: 1; }
    .ph.main { border-color: var(--amber); }
    .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ph__tag { position: absolute; top: 6px; left: 6px; background: var(--amber); color: #fff; font-size: 0.68rem; font-weight: 700; padding: 0.1rem 0.45rem; border-radius: 999px; }
    .ph__bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; gap: 2px; padding: 4px; background: linear-gradient(transparent, rgba(0,0,0,.6)); }
    .ph__bar button { border: none; background: rgba(255,255,255,.92); color: var(--ink); border-radius: 6px; font-size: 0.8rem; font-weight: 700; min-width: 28px; height: 28px; cursor: pointer; padding: 0 0.35rem; font-family: inherit; }
    .ph__bar button:disabled { opacity: 0.35; cursor: default; }
    .ph__bar button.x { color: var(--danger); }
    .ph__state { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255,255,255,.75); font-size: 0.8rem; font-weight: 700; color: var(--forest); text-align: center; padding: 0.4rem; }
    .ph__state.err { color: var(--danger); background: rgba(253,241,240,.92); }

    .toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%) translateY(150%); background: var(--forest-dk); color: #fff; padding: 0.75rem 1.2rem; border-radius: 999px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.25); transition: transform .25s; z-index: 50; max-width: calc(100vw - 2rem); }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast a { color: #ffd59e; margin-left: 0.5rem; }

    @media (max-width: 640px) {
      main { padding: 1rem; }
      header { padding: 0.8rem 1rem; gap: 0.6rem; }
      header h1 { font-size: 0.9rem; }
      .item__head .total { margin-left: 0; width: 100%; }
      .grid2, .grid3 { grid-template-columns: 1fr; }
      .toolbar .btn--primary { margin-left: 0; width: 100%; justify-content: center; }
      dialog { width: 100%; max-width: 100%; height: 100%; max-height: 100%; height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; }
      .ed { max-height: 100%; height: 100%; }
      .ed__body { flex: 1; padding: 1rem; }
      .prow img { width: 52px; height: 52px; }
      .ed__foot .spacer { display: none; }
      .ed__foot .btn--primary { flex: 1 1 100%; justify-content: center; padding: 0.75rem 1rem; font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>NORTHRUSH OUTDOORS</h1>
    <span class="tag">ADMIN</span>
    <a href="/" target="_blank" rel="noopener">View site ↗</a>
  </header>
  <main>
    <div class="row">
      <div class="tabs">
        <button class="tab" data-tab="products">Products<span class="count" id="count-products">–</span></button>
        <button class="tab" data-tab="inquiries">Orders<span class="count" id="count-inquiries">–</span></button>
        <button class="tab" data-tab="bookings">Messages<span class="count" id="count-bookings">–</span></button>
      </div>
      <button class="btn refresh" id="refresh">↻ Refresh</button>
    </div>
    <div id="content"><p class="empty">Loading…</p></div>
  </main>

  <dialog id="editor" aria-labelledby="ed-title">
    <form class="ed" id="ed-form" novalidate>
      <div class="ed__head">
        <h2 id="ed-title">Add product</h2>
        <button type="button" class="ed__close" data-close aria-label="Close">×</button>
      </div>
      <div class="ed__body">
        <fieldset>
          <legend>Photos</legend>
          <label class="drop" id="drop">
            <input type="file" id="ed-files" accept="image/*" multiple>
            <strong>+ Add photos</strong>
            Tap to choose from your phone or computer, or drag photos here.
          </label>
          <div class="photos" id="ed-photos"></div>
          <p class="hint">The first photo is the main one shown on the product card. Tap ★ to make a photo the main one, or ◀ ▶ to change the order.</p>
        </fieldset>

        <fieldset>
          <legend>Basics</legend>
          <label class="f">Product name <span class="req">*</span>
            <input name="name" required maxlength="200" placeholder="e.g. 5×6 Insulated Tower Blind">
          </label>
          <div class="grid2">
            <label class="f">Brand
              <input name="brand" maxlength="100" placeholder="e.g. NorthRush">
            </label>
            <label class="f">Badge <small>(optional label on the photo)</small>
              <select name="badge"><option value="">None</option></select>
            </label>
          </div>
          <div class="grid2">
            <label class="f">Category <span class="req">*</span>
              <select name="category" required></select>
            </label>
            <label class="f">Type
              <select name="subcategory"><option value="">—</option></select>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Price &amp; stock</legend>
          <div class="grid3">
            <label class="f">Price ($) <span class="req">*</span>
              <input name="price" type="number" inputmode="decimal" min="0" step="0.01" required>
            </label>
            <label class="f">Price up to ($) <small>for a range, e.g. $900–$1,400</small>
              <input name="price_max" type="number" inputmode="decimal" min="0" step="0.01">
            </label>
            <label class="f">Was ($) <small>shown crossed out</small>
              <input name="original_price" type="number" inputmode="decimal" min="0" step="0.01">
            </label>
          </div>
          <label class="check"><input type="checkbox" name="in_stock" checked> In stock</label>
        </fieldset>

        <fieldset>
          <legend>Details</legend>
          <label class="f">Key specs <small>one per line, the first 3 show on the product card</small>
            <textarea name="specs" rows="3" placeholder="5'×6' footprint&#10;Insulated walls&#10;6 tilt windows"></textarea>
          </label>
          <label class="f">Description
            <textarea name="description" rows="4" maxlength="10000"></textarea>
          </label>
          <label class="f">Features <small>one per line, shown as a bullet list</small>
            <textarea name="features" rows="4"></textarea>
          </label>
        </fieldset>
      </div>
      <div class="ed__foot">
        <p class="ed__msg" id="ed-msg" role="alert"></p>
        <button type="button" class="btn btn--danger" id="ed-delete" hidden>Delete</button>
        <a class="btn" id="ed-view" target="_blank" rel="noopener" hidden>View on site ↗</a>
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn btn--primary" id="ed-save">Save product</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (function () {
    "use strict";

    // Photos are resized in the browser before upload: fast on mobile data,
    // well under the server's body limit, and re-encoding drops EXIF (which
    // on phone photos includes the GPS location they were taken at).
    const PHOTO_MAX_SIDE = 1400;
    const PHOTO_QUALITY = 0.82;

    const TAB_KEY = "northrush_admin_tab";
    const $ = (sel, root) => (root || document).querySelector(sel);
    const content = $("#content");

    const state = {
      tab: "products",
      orders: { inquiries: [], bookings: [] },
      catalog: { products: [], categories: [], subcategories: {}, badges: [] },
      search: "",
      filterCat: "",
    };
    try { state.tab = localStorage.getItem(TAB_KEY) || state.tab; } catch (e) { /* private mode */ }
    if (!["products", "inquiries", "bookings"].includes(state.tab)) state.tab = "products";

    // ------------------------------------------------------------------ utils
    const money = (n) => "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const when = (iso) => iso ? new Date(iso + (iso.endsWith("Z") ? "" : "Z")).toLocaleString() : "";
    const imgSrc = (name) => !name ? "/static/images/placeholder.jpg"
      : /^https?:\/\//.test(name) ? name : "/static/images/" + name;
    const catLabel = (v) => (state.catalog.categories.find((c) => c.value === v) || {}).label || v;

    let toastTimer;
    function toast(html) {
      const t = $("#toast");
      t.innerHTML = html;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 4500);
    }

    const FIELD_NAMES = { name: "Product name", price: "Price", price_max: "Price up to",
      original_price: "Was price", category: "Category", subcategory: "Type", images: "Photos",
      brand: "Brand", description: "Description", features: "Features", badge: "Badge" };

    function errorText(status, data) {
      if (status === 401) return "Your login expired — reload the page and sign in again.";
      const d = data && data.detail;
      if (typeof d === "string") return d;
      if (Array.isArray(d) && d.length) {
        return d.map((e) => {
          const field = (e.loc || []).filter((x) => typeof x === "string" && x !== "body").pop();
          const msg = String(e.msg || "is invalid").replace(/^Value error, /, "");
          return (FIELD_NAMES[field] || field || "Input") + ": " + msg;
        }).join(" · ");
      }
      return "Something went wrong (error " + status + "). Try again.";
    }

    async function api(method, url, body) {
      const opts = { method, headers: { "X-Admin-Request": "1" } };
      if (body instanceof FormData) {
        opts.body = body;
      } else if (body !== undefined) {
        opts.headers["Content-Type"] = "application/json";
        opts.body = JSON.stringify(body);
      }
      let r;
      try { r = await fetch(url, opts); } catch (e) { throw new Error("Couldn't reach the server — check your connection."); }
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(errorText(r.status, data));
      return data;
    }

    // ---------------------------------------------------------------- loading
    function loadAll() {
      content.innerHTML = '<p class="empty">Loading…</p>';
      return Promise.all([
        api("GET", "/admin/products").then((d) => { state.catalog = d; }),
        api("GET", "/admin/data").then((d) => { state.orders = d; }),
      ]).then(() => {
        $("#count-products").textContent = state.catalog.products.length;
        $("#count-inquiries").textContent = state.orders.inquiries.length;
        $("#count-bookings").textContent = state.orders.bookings.length;
        fillSelects();
        render();
      }).catch((e) => {
        content.innerHTML = '<p class="error">' + esc(e.message) + "</p>";
      });
    }

    function setTab(tab) {
      state.tab = tab;
      try { localStorage.setItem(TAB_KEY, tab); } catch (e) { /* ignore */ }
      document.querySelectorAll(".tab").forEach((t) =>
        t.classList.toggle("active", t.getAttribute("data-tab") === tab));
      render();
    }

    function render() {
      if (state.tab === "products") return renderProducts();
      const rows = state.orders[state.tab] || [];
      content.innerHTML = rows.length
        ? rows.map(state.tab === "inquiries" ? renderInquiry : renderBooking).join("")
        : '<p class="empty">Nothing here yet.</p>';
    }

    // --------------------------------------------------------------- products
    function renderProducts() {
      const cats = state.catalog.categories;
      content.innerHTML =
        '<div class="toolbar">' +
          '<input type="search" id="p-search" placeholder="Search products…" aria-label="Search products" value="' + esc(state.search) + '">' +
          '<select id="p-cat" aria-label="Filter by category"><option value="">All categories</option>' +
            cats.map((c) => '<option value="' + esc(c.value) + '"' + (c.value === state.filterCat ? " selected" : "") + ">" + esc(c.label) + "</option>").join("") +
          "</select>" +
          '<button class="btn btn--primary" id="p-add">+ Add product</button>' +
        "</div>" +
        '<p class="listnote" id="p-note"></p><div class="plist" id="p-list"></div>';
      renderProductRows();
    }

    function renderProductRows() {
      const q = state.search.trim().toLowerCase();
      const rows = state.catalog.products.filter((p) =>
        (!state.filterCat || p.category === state.filterCat) &&
        (!q || (p.name + " " + p.brand + " " + p.slug).toLowerCase().includes(q)));
      $("#p-note").textContent = rows.length + " of " + state.catalog.products.length + " products · tap one to edit";
      $("#p-list").innerHTML = rows.length ? rows.map((p) =>
        '<button class="prow" data-edit="' + p.id + '">' +
          '<img src="' + esc(imgSrc(p.image)) + '" alt="" loading="lazy">' +
          '<span class="prow__main">' +
            '<span class="prow__name">' + esc(p.name) + "</span>" +
            '<span class="prow__sub">' +
              (!p.in_stock ? '<span class="pill pill--out">Out of stock</span>' : "") +
              (p.badge ? '<span class="pill pill--badge">' + esc(p.badge) + "</span>" : "") +
              (!p.images.length ? '<span class="pill pill--nophoto">No photo</span>' : "") +
              esc([p.brand, catLabel(p.category), p.subcategory].filter(Boolean).join(" · ")) +
            "</span>" +
          "</span>" +
          '<span class="prow__price">' + money(p.price) + (p.price_max ? "–" + money(p.price_max) : "") + "</span>" +
        "</button>").join("") : '<p class="empty">No products match.</p>';
    }

    // ----------------------------------------------------------------- editor
    const dlg = $("#editor");
    const form = $("#ed-form");
    const photosEl = $("#ed-photos");
    let editing = null;     // product being edited, or null when adding
    let photos = [];        // [{image, preview?, status?: "uploading"|"error", error?}]
    let snapshot = "";
    let uid = 0;

    function fillSelects() {
      form.category.innerHTML = state.catalog.categories.map((c) =>
        '<option value="' + esc(c.value) + '">' + esc(c.label) + "</option>").join("");
      form.badge.innerHTML = '<option value="">None</option>' + state.catalog.badges.map((b) =>
        '<option value="' + esc(b) + '">' + esc(b) + "</option>").join("");
    }

    function fillSubcats(selected) {
      const subs = state.catalog.subcategories[form.category.value] || [];
      form.subcategory.innerHTML = '<option value="">—</option>' + subs.map((s) =>
        '<option value="' + esc(s) + '"' + (s === selected ? " selected" : "") + ">" + esc(s) + "</option>").join("");
    }

    const numOrEmpty = (v) => v == null ? "" : String(v);

    function openEditor(p) {
      editing = p || null;
      form.reset();
      $("#ed-msg").textContent = "";
      $("#ed-title").textContent = p ? "Edit product" : "Add product";
      $("#ed-delete").hidden = !p;
      const view = $("#ed-view");
      view.hidden = !p;
      if (p) view.href = "/products/" + encodeURIComponent(p.slug);

      form.name.value = p ? p.name : "";
      form.brand.value = p ? p.brand : "";
      form.category.value = p ? p.category : (state.filterCat || (state.catalog.categories[0] || {}).value || "");
      fillSubcats(p ? p.subcategory : "");
      form.badge.value = p && p.badge ? p.badge : "";
      form.price.value = p ? numOrEmpty(p.price) : "";
      form.price_max.value = p ? numOrEmpty(p.price_max) : "";
      form.original_price.value = p ? numOrEmpty(p.original_price) : "";
      form.in_stock.checked = p ? p.in_stock : true;
      form.specs.value = p ? p.model_number.split("·").map((s) => s.trim()).filter(Boolean).join("\n") : "";
      form.description.value = p ? p.description : "";
      form.features.value = p ? p.features.join("\n") : "";
      photos = (p ? p.images : []).map((image) => ({ id: ++uid, image }));
      renderPhotos();
      snapshot = JSON.stringify(collect());
      dlg.showModal();
      if (!p) form.name.focus();
    }

    function closeEditor(force) {
      if (!force && JSON.stringify(collect()) !== snapshot &&
          !confirm("Discard your unsaved changes?")) return;
      photos.forEach((ph) => ph.preview && URL.revokeObjectURL(ph.preview));
      dlg.close();
    }

    const lines = (s) => s.split("\n").map((x) => x.trim()).filter(Boolean);
    const num = (s) => s.trim() === "" ? null : Number(s);

    function collect() {
      return {
        name: form.name.value.trim(),
        brand: form.brand.value.trim(),
        category: form.category.value,
        subcategory: form.subcategory.value,
        badge: form.badge.value || null,
        price: num(form.price.value),
        price_max: num(form.price_max.value),
        original_price: num(form.original_price.value),
        in_stock: form.in_stock.checked,
        model_number: lines(form.specs.value).join(" · "),
        description: form.description.value.trim(),
        features: lines(form.features.value),
        images: photos.filter((ph) => ph.image).map((ph) => ph.image),
      };
    }

    function validate(data) {
      if (!data.name) return ["name", "Enter a product name."];
      if (data.price == null || isNaN(data.price) || data.price < 0) return ["price", "Enter a price."];
      if (data.price_max != null && !(data.price_max > data.price)) return ["price_max", "'Price up to' must be higher than the price, or left empty."];
      if (data.original_price != null && !(data.original_price > data.price)) return ["original_price", "'Was' price must be higher than the price, or left empty."];
      if (photos.some((ph) => ph.status === "uploading")) return [null, "Wait for the photos to finish uploading."];
      return null;
    }

    async function save(e) {
      e.preventDefault();
      const data = collect();
      const problem = validate(data);
      const msg = $("#ed-msg");
      if (problem) {
        msg.textContent = problem[1];
        if (problem[0]) form[problem[0]].focus();
        return;
      }
      msg.textContent = "";
      const btn = $("#ed-save");
      btn.disabled = true;
      btn.textContent = "Saving…";
      try {
        const saved = editing
          ? await api("PUT", "/admin/products/" + editing.id, data)
          : await api("POST", "/admin/products", data);
        const list = state.catalog.products;
        const i = list.findIndex((x) => x.id === saved.id);
        if (i >= 0) list[i] = saved; else list.push(saved);
        $("#count-products").textContent = list.length;
        closeEditor(true);
        if (state.tab === "products") renderProductRows();
        toast("Saved “" + esc(saved.name) + "”" +
          '<a href="/products/' + encodeURIComponent(saved.slug) + '" target="_blank" rel="noopener">View on site ↗</a>');
      } catch (err) {
        msg.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Save product";
      }
    }

    async function removeProduct() {
      if (!editing) return;
      if (!confirm("Delete “" + editing.name + "” from the site? This can't be undone.")) return;
      try {
        await api("DELETE", "/admin/products/" + editing.id);
        state.catalog.products = state.catalog.products.filter((x) => x.id !== editing.id);
        $("#count-products").textContent = state.catalog.products.length;
        const name = editing.name;
        closeEditor(true);
        renderProductRows();
        toast("Deleted “" + esc(name) + "”");
      } catch (err) {
        $("#ed-msg").textContent = err.message;
      }
    }

    // ----------------------------------------------------------------- photos
    function renderPhotos() {
      const firstReal = photos.findIndex((ph) => ph.image);
      photosEl.innerHTML = photos.map((ph, i) => {
        const src = ph.preview || imgSrc(ph.image);
        const isMain = i === firstReal;
        return '<div class="ph' + (isMain ? " main" : "") + '" data-i="' + i + '">' +
          '<img src="' + esc(src) + '" alt="Photo ' + (i + 1) + '">' +
          (isMain ? '<span class="ph__tag">Main photo</span>' : "") +
          (ph.status === "uploading" ? '<span class="ph__state">Uploading…</span>' : "") +
          (ph.status === "error" ? '<span class="ph__state err">' + esc(ph.error) + "</span>" : "") +
          '<div class="ph__bar">' +
            '<button type="button" data-ph="left" aria-label="Move earlier"' + (i === 0 ? " disabled" : "") + ">◀</button>" +
            (!isMain && ph.image ? '<button type="button" data-ph="main" aria-label="Make main photo" title="Make main photo">★</button>' : "") +
            '<button type="button" data-ph="right" aria-label="Move later"' + (i === photos.length - 1 ? " disabled" : "") + ">▶</button>" +
            '<button type="button" class="x" data-ph="remove" aria-label="Remove photo">✕</button>' +
          "</div></div>";
      }).join("");
    }

    function shrink(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, PHOTO_MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.round(img.naturalWidth * scale);
          const h = Math.round(img.naturalHeight * scale);
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff";          // transparent PNGs become white, not black
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("Couldn't process photo")),
            "image/jpeg", PHOTO_QUALITY);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Can't read this file — use a JPG or PNG photo"));
        };
        img.src = url;
      });
    }

    function addFiles(files) {
      Array.from(files).filter((f) => f.type.startsWith("image/") || /\.(heic|heif)$/i.test(f.name)).forEach(async (file) => {
        const ph = { id: ++uid, image: null, preview: URL.createObjectURL(file), status: "uploading" };
        photos.push(ph);
        renderPhotos();
        try {
          const blob = await shrink(file);
          const fd = new FormData();
          fd.append("file", blob, "photo.jpg");
          const res = await api("POST", "/admin/uploads", fd);
          ph.image = res.image;
          ph.status = null;
        } catch (err) {
          ph.status = "error";
          ph.error = err.message;
        }
        renderPhotos();
      });
    }

    function photoAction(action, i) {
      const ph = photos[i];
      if (!ph) return;
      if (action === "remove") {
        if (ph.preview) URL.revokeObjectURL(ph.preview);
        photos.splice(i, 1);
      } else if (action === "left" && i > 0) {
        [photos[i - 1], photos[i]] = [photos[i], photos[i - 1]];
      } else if (action === "right" && i < photos.length - 1) {
        [photos[i + 1], photos[i]] = [photos[i], photos[i + 1]];
      } else if (action === "main") {
        photos.splice(i, 1);
        photos.unshift(ph);
      }
      renderPhotos();
    }

    // ---------------------------------------------------------- orders/messages
    function renderInquiry(i) {
      const items = (i.items || []).map((it) =>
        "<li>" + esc(it.qty) + " × " + esc(it.name) + " @ " + money(it.price) + "</li>").join("");
      return '<div class="item">' +
        '<div class="item__head"><h3>#' + i.id + " — " + esc(i.name) + "</h3>" +
        '<span class="when">' + esc(when(i.created_at)) + "</span>" +
        '<span class="total">' + money(i.total) + "</span></div>" +
        '<div class="meta">' +
          "<span><b>Phone:</b> " + esc(i.phone) + "</span>" +
          (i.email ? "<span><b>Email:</b> " + esc(i.email) + "</span>" : "") +
          (i.address ? "<span><b>Ship to:</b> " + esc(i.address) + ", " + esc(i.country) + "</span>" : "") +
          "<span><b>Freight:</b> " + esc(i.freight_region) + "</span>" +
          "<span><b>Contact:</b> " + esc(i.contact_pref) + (i.best_time ? " (" + esc(i.best_time) + ")" : "") + "</span>" +
          "<span><b>Payment:</b> " + esc(i.payment_method) + "</span>" +
        "</div>" +
        (items ? '<ul class="items-list">' + items + "</ul>" : "") +
        (i.notes ? '<div class="notes">' + esc(i.notes) + "</div>" : "") +
        '<button class="del" data-kind="inquiries" data-id="' + i.id + '">Delete</button>' +
      "</div>";
    }

    function renderBooking(b) {
      return '<div class="item">' +
        '<div class="item__head"><h3>#' + b.id + " — " + esc(b.name) + "</h3>" +
        '<span class="when">' + esc(when(b.created_at)) + "</span></div>" +
        '<div class="meta">' +
          "<span><b>Type:</b> " + esc(b.service) + "</span>" +
          (b.phone ? "<span><b>Phone:</b> " + esc(b.phone) + "</span>" : "") +
          (b.email ? "<span><b>Email:</b> " + esc(b.email) + "</span>" : "") +
          (b.product_interest ? "<span><b>Product:</b> " + esc(b.product_interest) + "</span>" : "") +
        "</div>" +
        (b.details ? '<div class="notes">' + esc(b.details) + "</div>" : "") +
        '<button class="del" data-kind="bookings" data-id="' + b.id + '">Delete</button>' +
      "</div>";
    }

    // ----------------------------------------------------------------- events
    content.addEventListener("input", (e) => {
      if (e.target.id === "p-search") { state.search = e.target.value; renderProductRows(); }
    });
    content.addEventListener("change", (e) => {
      if (e.target.id === "p-cat") { state.filterCat = e.target.value; renderProductRows(); }
    });

    document.addEventListener("click", (e) => {
      const tab = e.target.closest(".tab");
      if (tab) return setTab(tab.getAttribute("data-tab"));

      if (e.target.closest("#p-add")) return openEditor(null);
      const row = e.target.closest("[data-edit]");
      if (row) {
        const id = Number(row.getAttribute("data-edit"));
        return openEditor(state.catalog.products.find((p) => p.id === id));
      }

      const del = e.target.closest(".del");
      if (del) {
        const kind = del.getAttribute("data-kind");
        const id = del.getAttribute("data-id");
        if (!confirm("Delete " + (kind === "inquiries" ? "order" : "message") + " #" + id + "? This can't be undone.")) return;
        api("DELETE", "/admin/" + kind + "/" + id)
          .then(() => {
            state.orders[kind] = state.orders[kind].filter((x) => String(x.id) !== id);
            $("#count-" + kind).textContent = state.orders[kind].length;
            render();
          })
          .catch((err) => alert(err.message));
      }
    });

    form.addEventListener("submit", save);
    form.category.addEventListener("change", () => fillSubcats(""));
    $("#ed-delete").addEventListener("click", removeProduct);
    dlg.addEventListener("click", (e) => {
      if (e.target.closest("[data-close]")) closeEditor(false);
      const b = e.target.closest("[data-ph]");
      if (b) photoAction(b.getAttribute("data-ph"), Number(b.closest(".ph").getAttribute("data-i")));
    });
    dlg.addEventListener("cancel", (e) => { e.preventDefault(); closeEditor(false); });  // Esc key

    const fileInput = $("#ed-files");
    fileInput.addEventListener("change", () => { addFiles(fileInput.files); fileInput.value = ""; });
    const drop = $("#drop");
    ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));

    window.addEventListener("beforeunload", (e) => {
      if (dlg.open && JSON.stringify(collect()) !== snapshot) { e.preventDefault(); e.returnValue = ""; }
    });

    $("#refresh").addEventListener("click", loadAll);
    setTab(state.tab);
    loadAll();
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>NorthRush Admin</title>
  <style>
    :root {
      --forest: #1f4d3a; --forest-dk: #163a2c; --pine: #2e6f52;
      --canvas: #f7f5f0; --card: #fff; --ink: #16241d; --muted: #6b7580;
      --amber: #e08a2b; --border: #e6e3db;
    }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: "Inter", system-ui, sans-serif; background: var(--canvas); color: var(--ink); line-height: 1.5; }
    header { background: var(--forest-dk); color: #fff; padding: 0.9rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
    header h1 { font-size: 1.05rem; letter-spacing: 0.05em; }
    header .tag { background: var(--amber); color: #fff; font-size: 0.7rem; font-weight: 700; padding: 0.15rem 0.6rem; border-radius: 999px; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    .row { display: flex; gap: 0.8rem; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; }
    .tabs { display: flex; gap: 0.4rem; }
    .tab { border: 1px solid var(--border); background: var(--card); padding: 0.5rem 1.1rem; border-radius: 999px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
    .tab.active { background: var(--forest); color: #fff; border-color: var(--forest); }
    .count { background: rgba(31,77,58,.1); color: var(--forest); font-weight: 700; font-size: 0.75rem; padding: 0.1rem 0.55rem; border-radius: 999px; margin-left: 0.35rem; }
    button.refresh { margin-left: auto; border: 1px solid var(--border); background: var(--card); padding: 0.5rem 1rem; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .item { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.3rem; margin-bottom: 0.9rem; }
    .item__head { display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap; }
    .item__head h3 { font-size: 1rem; }
    .item__head .when { color: var(--muted); font-size: 0.78rem; }
    .item__head .total { margin-left: auto; font-weight: 800; color: var(--forest); font-size: 1.05rem; }
    .meta { display: flex; flex-wrap: wrap; gap: 0.35rem 1.1rem; margin: 0.5rem 0; font-size: 0.85rem; color: var(--muted); }
    .meta b { color: var(--ink); font-weight: 600; }
    .items-list { margin: 0.5rem 0; padding: 0.6rem 0.9rem; background: var(--canvas); border-radius: 10px; font-size: 0.85rem; }
    .items-list li { margin-left: 1rem; }
    .notes { font-size: 0.85rem; background: #fdf6ec; border: 1px solid #f0ddc0; border-radius: 10px; padding: 0.5rem 0.8rem; margin: 0.5rem 0; }
    .del { border: 1px solid #e5b6b2; color: #b3372f; background: #fdf1f0; padding: 0.35rem 0.9rem; border-radius: 999px; cursor: pointer; font-size: 0.8rem; font-weight: 600; margin-top: 0.4rem; }
    .del:hover { background: #b3372f; color: #fff; }
    .empty, .error { text-align: center; color: var(--muted); padding: 3rem 1rem; }
    .error { color: #b3372f; }
    @media (max-width: 600px) { main { padding: 1rem; } .item__head .total { margin-left: 0; width: 100%; } }

    /* ===== Additions: login, log out, Products tab — same look as above ===== */
    [hidden] { display: none !important; }
    .tabs { flex-wrap: wrap; }
    .tab.active .count { background: rgba(255,255,255,.2); color: #fff; }
    .logout { margin-left: auto; border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff; padding: 0.3rem 0.9rem; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 0.8rem; white-space: nowrap; }
    .logout:hover { background: rgba(255,255,255,.12); }

    .login { max-width: 380px; margin: 3rem auto; }
    .login h2 { font-size: 1.15rem; margin-bottom: 0.2rem; }
    .login p.sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
    .login .error { padding: 0; text-align: left; font-size: 0.85rem; font-weight: 600; margin-top: 0.7rem; }

    .pill-btn { border: 1px solid var(--border); background: var(--card); padding: 0.5rem 1rem; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 0.85rem; font-family: inherit; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem; }
    .pill-btn--primary { background: var(--forest); border-color: var(--forest); color: #fff; }
    .pill-btn--primary:hover { background: var(--pine); }
    .pill-btn--primary:disabled { opacity: 0.6; cursor: progress; }
    .pill-btn--danger { border-color: #e5b6b2; color: #b3372f; background: #fdf1f0; }
    .pill-btn--danger:hover { background: #b3372f; color: #fff; }

    .field { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 0.3rem; row-gap: 0.3rem; font-size: 0.82rem; font-weight: 600; min-width: 0; }
    .field small, .hint { font-weight: 400; color: var(--muted); font-size: 0.76rem; }
    .field input, .field select, .field textarea, .toolbar input, .toolbar select { flex: 1 1 100%; font: inherit; font-size: 0.92rem; padding: 0.55rem 0.75rem; border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--ink); width: 100%; min-width: 0; }
    .field textarea { resize: vertical; min-height: 5rem; }
    .field input:focus, .field select:focus, .field textarea:focus, .toolbar input:focus { outline: 2px solid var(--pine); outline-offset: -1px; }
    .req { color: #b3372f; }
    .stack { display: grid; gap: 0.85rem; }

    .toolbar { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
    .toolbar input { flex: 1 1 220px; width: auto; border-radius: 999px; }
    .toolbar select { flex: 0 1 230px; width: auto; border-radius: 999px; }
    .toolbar .pill-btn--primary { margin-left: auto; }
    .listnote { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.6rem; }
    .prow { display: flex; gap: 1rem; align-items: center; width: 100%; text-align: left; cursor: pointer; font: inherit; color: inherit; padding: 0.8rem 1.1rem 0.8rem 0.8rem; }
    .prow:hover { border-color: var(--pine); }
    .prow img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; background: var(--canvas); flex: none; }
    .prow__main { flex: 1; min-width: 0; }
    .prow__name { display: block; font-weight: 700; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .prow__sub { display: block; color: var(--muted); font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .prow .total { font-weight: 800; color: var(--forest); font-size: 1.05rem; white-space: nowrap; }
    .chip { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 0.05rem 0.5rem; border-radius: 999px; margin-right: 0.3rem; background: rgba(31,77,58,.1); color: var(--forest); }
    .chip--out { background: #fdf1f0; color: #b3372f; }
    .chip--badge { background: #fdf6ec; color: #a35d12; }

    dialog { border: none; border-radius: 14px; padding: 0; width: min(760px, calc(100% - 2rem)); max-height: calc(100vh - 2rem); background: var(--canvas); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    dialog::backdrop { background: rgba(22,58,44,.55); }
    .ed { display: flex; flex-direction: column; max-height: calc(100vh - 2rem); }
    .ed__head { background: var(--forest-dk); color: #fff; padding: 0.9rem 1.3rem; display: flex; align-items: center; gap: 1rem; }
    .ed__head h2 { font-size: 1rem; letter-spacing: 0.03em; flex: 1; }
    .ed__close { border: none; background: none; color: #fff; font-size: 1.5rem; line-height: 1; cursor: pointer; padding: 0 0.3rem; }
    .ed__body { overflow-y: auto; min-height: 0; padding: 1.1rem 1.3rem 0.2rem; }
    .ed__body .item h3 { font-size: 0.95rem; margin-bottom: 0.7rem; }
    .ed__body .item.stack h3 { margin-bottom: 0; }
    .ed__foot { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; padding: 0.9rem 1.3rem; background: var(--card); border-top: 1px solid var(--border); }
    .ed__foot .spacer { flex: 1; }
    .ed__msg { width: 100%; color: #b3372f; font-size: 0.85rem; font-weight: 600; }
    .ed__msg:empty { display: none; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.85rem; }
    .check { display: flex; gap: 0.5rem; align-items: center; font-size: 0.9rem; font-weight: 600; }
    .check input { width: 1.1rem; height: 1.1rem; accent-color: var(--forest); }

    .drop { display: block; border: 2px dashed #d8d3c6; border-radius: 10px; padding: 1.1rem; text-align: center; cursor: pointer; color: var(--muted); font-size: 0.88rem; background: var(--canvas); }
    .drop b { display: block; color: var(--forest); font-size: 0.98rem; }
    .drop.over { border-color: var(--forest); background: rgba(31,77,58,.06); }
    .drop input { display: none; }
    .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 0.7rem; margin-top: 0.8rem; }
    .photos:empty { display: none; }
    .ph { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 2px solid var(--border); background: var(--canvas); }
    .ph.main { border-color: var(--amber); }
    .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ph__tag { position: absolute; top: 6px; left: 6px; background: var(--amber); color: #fff; font-size: 0.68rem; font-weight: 700; padding: 0.1rem 0.5rem; border-radius: 999px; }
    .ph__bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; gap: 2px; padding: 4px; background: linear-gradient(transparent, rgba(0,0,0,.55)); }
    .ph__bar button { border: none; background: rgba(255,255,255,.92); color: var(--ink); border-radius: 999px; font-size: 0.78rem; font-weight: 700; min-width: 28px; height: 28px; cursor: pointer; font-family: inherit; }
    .ph__bar button:disabled { opacity: 0.35; cursor: default; }
    .ph__bar .x { color: #b3372f; }
    .ph__state { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 0.4rem; background: rgba(255,255,255,.78); font-size: 0.8rem; font-weight: 700; color: var(--forest); }
    .ph__state.err { color: #b3372f; background: rgba(253,241,240,.93); }

    .toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translate(-50%, calc(100% + 2rem)); visibility: hidden; background: var(--forest-dk); color: #fff; padding: 0.7rem 1.2rem; border-radius: 999px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.25); transition: transform .25s; z-index: 50; max-width: calc(100% - 2rem); }
    .toast.show { transform: translate(-50%, 0); visibility: visible; }
    .toast a { color: #ffd59e; margin-left: 0.5rem; }

    @media (max-width: 600px) {
      header { padding: 0.9rem 1rem; }
      .grid2, .grid3 { grid-template-columns: 1fr; }
      .toolbar input, .toolbar select { flex: 1 1 100%; }
      .toolbar .pill-btn--primary { margin-left: 0; flex: 1 1 100%; }
      .prow { gap: 0.75rem; }
      .prow img { width: 52px; height: 52px; }
      dialog { width: 100%; max-width: 100%; height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; }
      .ed { height: 100%; max-height: 100%; }
      .ed__body { flex: 1; padding: 1rem 1rem 0.2rem; }
      .ed__foot .spacer { display: none; }
      .ed__foot .pill-btn--primary { flex: 1 1 100%; padding: 0.75rem 1rem; font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>NORTHRUSH OUTDOORS</h1>
    <span class="tag">ADMIN</span>
    <button class="logout" id="logout" hidden>Log out</button>
  </header>

  <!-- Login -->
  <main id="login-view" hidden>
    <form class="item login" id="login-form" novalidate>
      <h2>Admin login</h2>
      <p class="sub">Sign in to manage orders, messages and products.</p>
      <div class="stack">
        <label class="field">Username
          <input id="login-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>
        <label class="field">Password
          <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="pill-btn pill-btn--primary" id="login-btn">Sign in</button>
      </div>
      <p class="error" id="login-error" role="alert" hidden></p>
    </form>
  </main>

  <!-- Dashboard -->
  <main id="dash-view" hidden>
    <div class="row">
      <div class="tabs">
        <button class="tab active" data-tab="inquiries">Orders<span class="count" id="count-inquiries">0</span></button>
        <button class="tab" data-tab="bookings">Messages<span class="count" id="count-bookings">0</span></button>
        <button class="tab" data-tab="products">Products<span class="count" id="count-products">0</span></button>
      </div>
      <button class="refresh" id="refresh">↻ Refresh</button>
    </div>
    <div id="content"><p class="empty">Loading…</p></div>
  </main>

  <!-- Product editor -->
  <dialog id="editor" aria-labelledby="ed-title">
    <form class="ed" id="ed-form" novalidate>
      <div class="ed__head">
        <h2 id="ed-title">Add product</h2>
        <button type="button" class="ed__close" data-close aria-label="Close">×</button>
      </div>
      <div class="ed__body">
        <div class="item">
          <h3>Photos</h3>
          <label class="drop" id="drop">
            <input type="file" id="ed-files" accept="image/*" multiple>
            <b>+ Add photos</b>
            Tap to choose from your phone or computer, or drag photos here.
          </label>
          <div class="photos" id="ed-photos"></div>
          <p class="hint" style="margin-top:0.6rem">The first photo is the main one shown on the product card. Tap ★ to make a photo the main one, or ◀ ▶ to change the order.</p>
        </div>

        <div class="item stack">
          <h3>Basics</h3>
          <label class="field">Product name <span class="req">*</span>
            <input name="name" maxlength="200" placeholder="e.g. 5×6 Insulated Tower Blind">
          </label>
          <div class="grid2">
            <label class="field">Brand
              <input name="brand" maxlength="100" placeholder="e.g. NorthRush">
            </label>
            <label class="field">Badge <small>(optional label on the photo)</small>
              <select name="badge"><option value="">None</option></select>
            </label>
          </div>
          <div class="grid2">
            <label class="field">Category <span class="req">*</span>
              <select name="category"></select>
            </label>
            <label class="field">Type
              <select name="subcategory"><option value="">—</option></select>
            </label>
          </div>
        </div>

        <div class="item stack">
          <h3>Price &amp; stock</h3>
          <div class="grid3">
            <label class="field">Price ($) <span class="req">*</span>
              <input name="price" type="number" inputmode="decimal" min="0" step="0.01">
            </label>
            <label class="field">Price up to ($) <small>for a range</small>
              <input name="price_max" type="number" inputmode="decimal" min="0" step="0.01">
            </label>
            <label class="field">Was ($) <small>shown crossed out</small>
              <input name="original_price" type="number" inputmode="decimal" min="0" step="0.01">
            </label>
          </div>
          <label class="check"><input type="checkbox" name="in_stock" checked> In stock</label>
        </div>

        <div class="item stack">
          <h3>Details</h3>
          <label class="field">Key specs <small>one per line — the first 3 show on the product card</small>
            <textarea name="specs" rows="3" placeholder="5'×6' footprint&#10;Insulated walls&#10;6 tilt windows"></textarea>
          </label>
          <label class="field">Description
            <textarea name="description" rows="4" maxlength="10000"></textarea>
          </label>
          <label class="field">Features <small>one per line, shown as a bullet list</small>
            <textarea name="features" rows="4"></textarea>
          </label>
        </div>
      </div>
      <div class="ed__foot">
        <p class="ed__msg" id="ed-msg" role="alert"></p>
        <button type="button" class="pill-btn pill-btn--danger" id="ed-delete" hidden>Delete</button>
        <a class="pill-btn" id="ed-view" target="_blank" rel="noopener" hidden>View on site ↗</a>
        <span class="spacer"></span>
        <button type="button" class="pill-btn" data-close>Cancel</button>
        <button type="submit" class="pill-btn pill-btn--primary" id="ed-save">Save product</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";
      var state = {
        tab: "inquiries",
        data: { inquiries: [], bookings: [] },
        catalog: { products: [], categories: [], subcategories: {}, badges: [] },
        search: "",
        filterCat: ""
      };
      var content = document.getElementById("content");
      var $ = function (sel) { return document.querySelector(sel); };

      function money(n) { return "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2 }); }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function when(iso) {
        if (!iso) return "";
        var d = new Date(iso + (iso.endsWith("Z") ? "" : "Z"));
        return d.toLocaleString();
      }

      // ------------------------------------------------------------ API + auth
      var FIELD_NAMES = { name: "Product name", price: "Price", price_max: "Price up to",
        original_price: "Was price", category: "Category", subcategory: "Type", images: "Photos",
        brand: "Brand", description: "Description", features: "Features", badge: "Badge" };

      function errorText(status, data) {
        var d = data && data.detail;
        if (typeof d === "string") return d;
        if (Array.isArray(d) && d.length) {
          return d.map(function (e) {
            var field = (e.loc || []).filter(function (x) { return typeof x === "string" && x !== "body"; }).pop();
            var msg = String(e.msg || "is invalid").replace(/^Value error, /, "");
            return (FIELD_NAMES[field] || field || "Input") + ": " + msg;
          }).join(" · ");
        }
        return "Something went wrong (error " + status + "). Try again.";
      }

      function api(method, url, body) {
        var opts = { method: method, credentials: "same-origin", headers: { "X-Admin-Request": "1" } };
        if (body instanceof FormData) {
          opts.body = body;
        } else if (body !== undefined) {
          opts.headers["Content-Type"] = "application/json";
          opts.body = JSON.stringify(body);
        }
        return fetch(url, opts).catch(function () {
          throw new Error("Couldn't reach the server — check your connection.");
        }).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (data) {
            if (r.status === 401 && url !== "/admin/login") {
              showLogin("Your session expired — please sign in again.");
              throw new Error("Please sign in again.");
            }
            if (!r.ok) throw new Error(errorText(r.status, data));
            return data;
          });
        });
      }

      function showLogin(message) {
        if ($("#editor").open) $("#editor").close();
        $("#dash-view").hidden = true;
        $("#logout").hidden = true;
        $("#login-view").hidden = false;
        var err = $("#login-error");
        err.textContent = message || "";
        err.hidden = !message;
        $("#login-pass").value = "";
        ($("#login-user").value ? $("#login-pass") : $("#login-user")).focus();
      }

      function showDash() {
        $("#login-view").hidden = true;
        $("#dash-view").hidden = false;
        $("#logout").hidden = false;
        load();
      }

      $("#login-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var user = $("#login-user").value.trim();
        var pass = $("#login-pass").value;
        var err = $("#login-error");
        if (!user || !pass) { err.textContent = "Enter your username and password."; err.hidden = false; return; }
        var btn = $("#login-btn");
        btn.disabled = true;
        btn.textContent = "Signing in…";
        api("POST", "/admin/login", { username: user, password: pass })
          .then(showDash)
          .catch(function (ex) {
            err.textContent = ex.message;
            err.hidden = false;
            $("#login-pass").value = "";
            $("#login-pass").focus();
          })
          .then(function () { btn.disabled = false; btn.textContent = "Sign in"; });
      });

      $("#logout").addEventListener("click", function () {
        api("POST", "/admin/logout").catch(function () {}).then(function () { showLogin(""); });
      });

      // --------------------------------------------------------------- loading
      function load() {
        content.innerHTML = '<p class="empty">Loading…</p>';
        Promise.all([api("GET", "/admin/data"), api("GET", "/admin/products")])
          .then(function (res) {
            state.data = res[0];
            state.catalog = res[1];
            document.getElementById("count-inquiries").textContent = state.data.inquiries.length;
            document.getElementById("count-bookings").textContent = state.data.bookings.length;
            document.getElementById("count-products").textContent = state.catalog.products.length;
            fillSelects();
            render();
          })
          .catch(function (e) {
            if ($("#dash-view").hidden) return;   // sent back to the login screen
            content.innerHTML = '<p class="error">' + esc(e.message || "Couldn't load data. Is the server running?") + "</p>";
          });
      }

      function render() {
        if (state.tab === "products") return renderProducts();
        var rows = state.data[state.tab] || [];
        if (!rows.length) {
          content.innerHTML = '<p class="empty">Nothing here yet.</p>';
          return;
        }
        content.innerHTML = rows.map(state.tab === "inquiries" ? renderInquiry : renderBooking).join("");
      }

      function renderInquiry(i) {
        var items = (i.items || []).map(function (it) {
          return "<li>" + esc(it.qty) + " × " + esc(it.name) + " @ " + money(it.price) + "</li>";
        }).join("");
        return '<div class="item">' +
          '<div class="item__head"><h3>#' + i.id + " — " + esc(i.name) + '</h3>' +
          '<span class="when">' + esc(when(i.created_at)) + '</span>' +
          '<span class="total">' + money(i.total) + "</span></div>" +
          '<div class="meta">' +
            "<span><b>Phone:</b> " + esc(i.phone) + "</span>" +
            (i.email ? "<span><b>Email:</b> " + esc(i.email) + "</span>" : "") +
            (i.address ? "<span><b>Ship to:</b> " + esc(i.address) + ", " + esc(i.country) + "</span>" : "") +
            "<span><b>Freight:</b> " + esc(i.freight_region) + "</span>" +
            "<span><b>Contact:</b> " + esc(i.contact_pref) + (i.best_time ? " (" + esc(i.best_time) + ")" : "") + "</span>" +
            "<span><b>Payment:</b> " + esc(i.payment_method) + "</span>" +
            (i.coupon_code ? "<span><b>Coupon:</b> " + esc(i.coupon_code) + " (−" + money(i.discount) + ")</span>" : "") +
          "</div>" +
          (items ? '<ul class="items-list">' + items + "</ul>" : "") +
          (i.notes ? '<div class="notes">' + esc(i.notes) + "</div>" : "") +
          '<button class="del" data-kind="inquiries" data-id="' + i.id + '">Delete</button>' +
        "</div>";
      }

      function renderBooking(b) {
        return '<div class="item">' +
          '<div class="item__head"><h3>#' + b.id + " — " + esc(b.name) + '</h3>' +
          '<span class="when">' + esc(when(b.created_at)) + "</span></div>" +
          '<div class="meta">' +
            "<span><b>Type:</b> " + esc(b.service) + "</span>" +
            (b.phone ? "<span><b>Phone:</b> " + esc(b.phone) + "</span>" : "") +
            (b.email ? "<span><b>Email:</b> " + esc(b.email) + "</span>" : "") +
            (b.product_interest ? "<span><b>Product:</b> " + esc(b.product_interest) + "</span>" : "") +
          "</div>" +
          (b.details ? '<div class="notes">' + esc(b.details) + "</div>" : "") +
          '<button class="del" data-kind="bookings" data-id="' + b.id + '">Delete</button>' +
        "</div>";
      }

      // -------------------------------------------------------------- products
      function imgSrc(name) {
        if (!name) return "/static/images/placeholder.jpg";
        return /^https?:\/\//.test(name) ? name : "/static/images/" + name;
      }
      function catLabel(v) {
        var c = state.catalog.categories.filter(function (x) { return x.value === v; })[0];
        return c ? c.label : v;
      }
      function price(n) { return "$" + Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 }); }

      function renderProducts() {
        content.innerHTML =
          '<div class="toolbar">' +
            '<input type="search" id="p-search" placeholder="Search products…" aria-label="Search products" value="' + esc(state.search) + '">' +
            '<select id="p-cat" aria-label="Filter by category"><option value="">All categories</option>' +
              state.catalog.categories.map(function (c) {
                return '<option value="' + esc(c.value) + '"' + (c.value === state.filterCat ? " selected" : "") + ">" + esc(c.label) + "</option>";
              }).join("") +
            "</select>" +
            '<button class="pill-btn pill-btn--primary" id="p-add">+ Add product</button>' +
          "</div>" +
          '<p class="listnote" id="p-note"></p><div id="p-list"></div>';
        renderProductRows();
      }

      function renderProductRows() {
        var q = state.search.trim().toLowerCase();
        var all = state.catalog.products;
        var rows = all.filter(function (p) {
          return (!state.filterCat || p.category === state.filterCat) &&
            (!q || (p.name + " " + p.brand + " " + p.slug).toLowerCase().indexOf(q) !== -1);
        });
        $("#p-note").textContent = rows.length + " of " + all.length + " products · click one to edit";
        $("#p-list").innerHTML = rows.length ? rows.map(function (p) {
          return '<button class="item prow" data-edit="' + p.id + '">' +
            '<img src="' + esc(imgSrc(p.image)) + '" alt="" loading="lazy">' +
            '<span class="prow__main">' +
              '<span class="prow__name">' + esc(p.name) + "</span>" +
              '<span class="prow__sub">' +
                (!p.in_stock ? '<span class="chip chip--out">Out of stock</span>' : "") +
                (p.badge ? '<span class="chip chip--badge">' + esc(p.badge) + "</span>" : "") +
                (!p.images.length ? '<span class="chip">No photo</span>' : "") +
                esc([p.brand, catLabel(p.category), p.subcategory].filter(Boolean).join(" · ")) +
              "</span>" +
            "</span>" +
            '<span class="total">' + price(p.price) + (p.price_max ? "–" + price(p.price_max) : "") + "</span>" +
          "</button>";
        }).join("") : '<p class="empty">No products match.</p>';
      }

      // ---------------------------------------------------------------- editor
      // Photos are resized in the browser before upload: fast on mobile data,
      // well under the server limit, and re-encoding drops EXIF — which on
      // phone photos includes the GPS location they were taken at.
      var PHOTO_MAX_SIDE = 1400, PHOTO_QUALITY = 0.82;
      var dlg = $("#editor"), form = $("#ed-form"), photosEl = $("#ed-photos");
      var editing = null, photos = [], snapshot = "";

      function fillSelects() {
        form.category.innerHTML = state.catalog.categories.map(function (c) {
          return '<option value="' + esc(c.value) + '">' + esc(c.label) + "</option>";
        }).join("");
        form.badge.innerHTML = '<option value="">None</option>' + state.catalog.badges.map(function (b) {
          return '<option value="' + esc(b) + '">' + esc(b) + "</option>";
        }).join("");
      }

      function fillSubcats(selected) {
        var subs = state.catalog.subcategories[form.category.value] || [];
        form.subcategory.innerHTML = '<option value="">—</option>' + subs.map(function (s) {
          return '<option value="' + esc(s) + '"' + (s === selected ? " selected" : "") + ">" + esc(s) + "</option>";
        }).join("");
      }

      function numStr(v) { return v == null ? "" : String(v); }
      function lines(s) { return s.split("\n").map(function (x) { return x.trim(); }).filter(Boolean); }
      function num(s) { return s.trim() === "" ? null : Number(s); }

      function openEditor(p) {
        editing = p || null;
        form.reset();
        $("#ed-msg").textContent = "";
        $("#ed-title").textContent = p ? "Edit product" : "Add product";
        $("#ed-delete").hidden = !p;
        $("#ed-view").hidden = !p;
        if (p) $("#ed-view").href = "/products/" + encodeURIComponent(p.slug);
        form.name.value = p ? p.name : "";
        form.brand.value = p ? p.brand : "";
        form.category.value = p ? p.category : (state.filterCat || (state.catalog.categories[0] || {}).value || "");
        fillSubcats(p ? p.subcategory : "");
        form.badge.value = p && p.badge ? p.badge : "";
        form.price.value = p ? numStr(p.price) : "";
        form.price_max.value = p ? numStr(p.price_max) : "";
        form.original_price.value = p ? numStr(p.original_price) : "";
        form.in_stock.checked = p ? p.in_stock : true;
        form.specs.value = p ? p.model_number.split("·").map(function (s) { return s.trim(); }).filter(Boolean).join("\n") : "";
        form.description.value = p ? p.description : "";
        form.features.value = p ? p.features.join("\n") : "";
        photos = (p ? p.images : []).map(function (image) { return { image: image }; });
        renderPhotos();
        snapshot = JSON.stringify(collect());
        dlg.showModal();
        if (!p) form.name.focus();
      }

      function closeEditor(force) {
        if (!force && JSON.stringify(collect()) !== snapshot && !confirm("Discard your unsaved changes?")) return;
        photos.forEach(function (ph) { if (ph.preview) URL.revokeObjectURL(ph.preview); });
        dlg.close();
      }

      function collect() {
        return {
          name: form.name.value.trim(),
          brand: form.brand.value.trim(),
          category: form.category.value,
          subcategory: form.subcategory.value,
          badge: form.badge.value || null,
          price: num(form.price.value),
          price_max: num(form.price_max.value),
          original_price: num(form.original_price.value),
          in_stock: form.in_stock.checked,
          model_number: lines(form.specs.value).join(" · "),
          description: form.description.value.trim(),
          features: lines(form.features.value),
          images: photos.filter(function (ph) { return ph.image; }).map(function (ph) { return ph.image; })
        };
      }

      function validate(d) {
        if (!d.name) return ["name", "Enter a product name."];
        if (d.price == null || isNaN(d.price) || d.price < 0) return ["price", "Enter a price."];
        if (d.price_max != null && !(d.price_max > d.price)) return ["price_max", "'Price up to' must be higher than the price, or left empty."];
        if (d.original_price != null && !(d.original_price > d.price)) return ["original_price", "'Was' price must be higher than the price, or left empty."];
        if (photos.some(function (ph) { return ph.status === "uploading"; })) return [null, "Wait for the photos to finish uploading."];
        return null;
      }

      var toastTimer;
      function toast(html) {
        var t = $("#toast");
        t.innerHTML = html;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.classList.remove("show"); }, 4500);
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var d = collect(), problem = validate(d), msg = $("#ed-msg");
        if (problem) {
          msg.textContent = problem[1];
          if (problem[0]) form[problem[0]].focus();
          return;
        }
        msg.textContent = "";
        var btn = $("#ed-save");
        btn.disabled = true;
        btn.textContent = "Saving…";
        (editing ? api("PUT", "/admin/products/" + editing.id, d) : api("POST", "/admin/products", d))
          .then(function (saved) {
            var list = state.catalog.products, found = false;
            for (var i = 0; i < list.length; i++) if (list[i].id === saved.id) { list[i] = saved; found = true; }
            if (!found) list.push(saved);
            $("#count-products").textContent = list.length;
            closeEditor(true);
            if (state.tab === "products") renderProductRows();
            toast("Saved “" + esc(saved.name) + "”" +
              '<a href="/products/' + encodeURIComponent(saved.slug) + '" target="_blank" rel="noopener">View on site ↗</a>');
          })
          .catch(function (err) { msg.textContent = err.message; })
          .then(function () { btn.disabled = false; btn.textContent = "Save product"; });
      });

      $("#ed-delete").addEventListener("click", function () {
        if (!editing || !confirm("Delete “" + editing.name + "” from the site? This can't be undone.")) return;
        var gone = editing;
        api("DELETE", "/admin/products/" + gone.id)
          .then(function () {
            state.catalog.products = state.catalog.products.filter(function (x) { return x.id !== gone.id; });
            $("#count-products").textContent = state.catalog.products.length;
            closeEditor(true);
            renderProductRows();
            toast("Deleted “" + esc(gone.name) + "”");
          })
          .catch(function (err) { $("#ed-msg").textContent = err.message; });
      });

      // ---------------------------------------------------------------- photos
      function renderPhotos() {
        var firstReal = -1;
        for (var k = 0; k < photos.length; k++) if (photos[k].image) { firstReal = k; break; }
        photosEl.innerHTML = photos.map(function (ph, i) {
          var isMain = i === firstReal;
          return '<div class="ph' + (isMain ? " main" : "") + '" data-i="' + i + '">' +
            '<img src="' + esc(ph.preview || imgSrc(ph.image)) + '" alt="Photo ' + (i + 1) + '">' +
            (isMain ? '<span class="ph__tag">Main photo</span>' : "") +
            (ph.status === "uploading" ? '<span class="ph__state">Uploading…</span>' : "") +
            (ph.status === "error" ? '<span class="ph__state err">' + esc(ph.error) + "</span>" : "") +
            '<div class="ph__bar">' +
              '<button type="button" data-ph="left" aria-label="Move earlier"' + (i === 0 ? " disabled" : "") + ">◀</button>" +
              (!isMain && ph.image ? '<button type="button" data-ph="main" aria-label="Make main photo" title="Make main photo">★</button>' : "") +
              '<button type="button" data-ph="right" aria-label="Move later"' + (i === photos.length - 1 ? " disabled" : "") + ">▶</button>" +
              '<button type="button" class="x" data-ph="remove" aria-label="Remove photo">✕</button>' +
            "</div></div>";
        }).join("");
      }

      function shrink(file) {
        return new Promise(function (resolve, reject) {
          var url = URL.createObjectURL(file);
          var img = new Image();
          img.onload = function () {
            var scale = Math.min(1, PHOTO_MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
            var w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
            var canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext("2d");
            ctx.fillStyle = "#fff";            // transparent PNGs become white, not black
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            URL.revokeObjectURL(url);
            canvas.toBlob(function (blob) {
              if (blob) resolve(blob); else reject(new Error("Couldn't process photo"));
            }, "image/jpeg", PHOTO_QUALITY);
          };
          img.onerror = function () {
            URL.revokeObjectURL(url);
            reject(new Error("Can't read this file — use a JPG or PNG photo"));
          };
          img.src = url;
        });
      }

      function addFiles(files) {
        Array.prototype.forEach.call(files, function (file) {
          if (!/^image\//.test(file.type) && !/\.(heic|heif)$/i.test(file.name)) return;
          var ph = { image: null, preview: URL.createObjectURL(file), status: "uploading" };
          photos.push(ph);
          renderPhotos();
          shrink(file)
            .then(function (blob) {
              var fd = new FormData();
              fd.append("file", blob, "photo.jpg");
              return api("POST", "/admin/uploads", fd);
            })
            .then(function (res) { ph.image = res.image; ph.status = null; })
            .catch(function (err) { ph.status = "error"; ph.error = err.message; })
            .then(renderPhotos);
        });
      }

      function photoAction(action, i) {
        var ph = photos[i], t;
        if (!ph) return;
        if (action === "remove") {
          if (ph.preview) URL.revokeObjectURL(ph.preview);
          photos.splice(i, 1);
        } else if (action === "left" && i > 0) {
          t = photos[i - 1]; photos[i - 1] = ph; photos[i] = t;
        } else if (action === "right" && i < photos.length - 1) {
          t = photos[i + 1]; photos[i + 1] = ph; photos[i] = t;
        } else if (action === "main") {
          photos.splice(i, 1);
          photos.unshift(ph);
        }
        renderPhotos();
      }

      // ---------------------------------------------------------------- events
      content.addEventListener("input", function (e) {
        if (e.target.id === "p-search") { state.search = e.target.value; renderProductRows(); }
      });
      content.addEventListener("change", function (e) {
        if (e.target.id === "p-cat") { state.filterCat = e.target.value; renderProductRows(); }
      });

      document.addEventListener("click", function (e) {
        var tab = e.target.closest(".tab");
        if (tab) {
          state.tab = tab.getAttribute("data-tab");
          document.querySelectorAll(".tab").forEach(function (t) { t.classList.remove("active"); });
          tab.classList.add("active");
          render();
          return;
        }
        if (e.target.closest("#p-add")) return openEditor(null);
        var row = e.target.closest("[data-edit]");
        if (row) {
          var id = Number(row.getAttribute("data-edit"));
          return openEditor(state.catalog.products.filter(function (p) { return p.id === id; })[0]);
        }
        var del = e.target.closest(".del");
        if (del) {
          var kind = del.getAttribute("data-kind");
          var did = del.getAttribute("data-id");
          if (!confirm("Delete " + (kind === "inquiries" ? "order" : "message") + " #" + did + "? This can't be undone.")) return;
          api("DELETE", "/admin/" + kind + "/" + did)
            .then(function () { load(); })
            .catch(function (err) { alert(err.message || "Delete failed — try refreshing."); });
        }
      });

      form.category.addEventListener("change", function () { fillSubcats(""); });
      dlg.addEventListener("click", function (e) {
        if (e.target.closest("[data-close]")) return closeEditor(false);
        var b = e.target.closest("[data-ph]");
        if (b) photoAction(b.getAttribute("data-ph"), Number(b.closest(".ph").getAttribute("data-i")));
      });
      dlg.addEventListener("cancel", function (e) { e.preventDefault(); closeEditor(false); });   // Esc key

      var fileInput = $("#ed-files"), drop = $("#drop");
      fileInput.addEventListener("change", function () { addFiles(fileInput.files); fileInput.value = ""; });
      ["dragenter", "dragover"].forEach(function (ev) {
        drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); });
      });
      ["dragleave", "drop"].forEach(function (ev) {
        drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); });
      });
      drop.addEventListener("drop", function (e) { addFiles(e.dataTransfer.files); });

      window.addEventListener("beforeunload", function (e) {
        if (dlg.open && JSON.stringify(collect()) !== snapshot) { e.preventDefault(); e.returnValue = ""; }
      });

      document.getElementById("refresh").addEventListener("click", load);

      // Already signed in (cookie still valid)? Go straight to the dashboard.
      fetch("/admin/session", { credentials: "same-origin" })
        .then(function (r) { if (r.ok) showDash(); else showLogin(""); })
        .catch(function () { showLogin("Couldn't reach the server. Is it running?"); });
    })();
  </script>
</body>
</html>
